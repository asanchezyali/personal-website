<!--
  Starter template for a hand-authored diagram.
  - Keep ALL coordinates inside the viewBox (here 920 x 560).
  - Style with the CLASSES below, not inline attributes, for consistency.
  - Use ONE accent color + grays. Change the palette block to rebrand.
  - Escape "&" as "&amp;" inside <text>, or the SVG won't parse.
  - Render with scripts/svg-to-png.mjs (rasterizes at 2x).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      /* ---- palette: swap the accent (#19a567 / #0f3d2e) to rebrand ---- */
      .bg        { fill: #f6faf7; }
      .card      { fill: #ffffff; stroke: #d9e6dd; stroke-width: 1.5; }
      .card-soft { fill: #e9f6ee; stroke: #bfe3cc; stroke-width: 1.5; }
      .card-dark { fill: #0f3d2e; stroke: #15543f; stroke-width: 1.5; }
      .title     { fill: #0f3d2e; font-size: 18px; font-weight: 700; }
      .label     { fill: #1f4a39; font-size: 12.5px; font-weight: 700; }
      .sub       { fill: #5a6b62; font-size: 11px; }
      .white     { fill: #ffffff; font-size: 13px; font-weight: 700; }
      .whitesub  { fill: #b9e6cc; font-size: 10.5px; }
      .group     { fill: #0f3d2e; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
      .edge      { stroke: #19a567; stroke-width: 2; fill: none; }
      .elab      { fill: #3c6b53; font-size: 10px; font-weight: 600; }
    </style>
    <!-- reusable arrowhead: reference with marker-end="url(#arr)" -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#19a567"/>
    </marker>
  </defs>

  <!-- backdrop (gives the diagram its own light bg so it reads in dark mode too) -->
  <rect class="bg" x="0" y="0" width="920" height="560" rx="14"/>

  <!-- title + optional subtitle -->
  <text x="32" y="40" class="title">Diagram title</text>
  <text x="32" y="60" class="sub">One-line subtitle</text>

  <!-- a box = <rect> + one or more centered <text> -->
  <rect class="card" x="32" y="100" width="180" height="80" rx="12"/>
  <text x="122" y="134" text-anchor="middle" class="label">Component A</text>
  <text x="122" y="153" text-anchor="middle" class="sub">short note</text>

  <rect class="card-soft" x="300" y="100" width="180" height="80" rx="12"/>
  <text x="390" y="134" text-anchor="middle" class="label">Component B</text>
  <text x="390" y="153" text-anchor="middle" class="sub">short note</text>

  <rect class="card-dark" x="568" y="100" width="180" height="80" rx="12"/>
  <text x="658" y="134" text-anchor="middle" class="white">Component C</text>
  <text x="658" y="153" text-anchor="middle" class="whitesub">short note</text>

  <!-- arrows: M start L end, with a marker-end. Add a small .elab to label them -->
  <path class="edge" d="M212,140 L300,140" marker-end="url(#arr)"/>
  <text x="222" y="132" class="elab">request</text>
  <path class="edge" d="M480,140 L568,140" marker-end="url(#arr)"/>
</svg>
