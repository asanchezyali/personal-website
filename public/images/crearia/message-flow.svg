<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #f6faf7; }
      .step { fill: #ffffff; stroke: #d9e6dd; stroke-width: 1.5; }
      .step-green { fill: #e9f6ee; stroke: #bfe3cc; stroke-width: 1.5; }
      .step-dark { fill: #0f3d2e; stroke: #15543f; stroke-width: 1.5; }
      .title { fill: #0f3d2e; font-size: 18px; font-weight: 700; }
      .sub { fill: #5a6b62; font-size: 11px; }
      .label { fill: #1f4a39; font-size: 12.5px; font-weight: 700; }
      .desc { fill: #5a6b62; font-size: 10.5px; }
      .white { fill: #ffffff; font-size: 12.5px; font-weight: 700; }
      .whitesub { fill: #b9e6cc; font-size: 10.5px; }
      .edge { stroke: #19a567; stroke-width: 2; fill: none; }
      .branch { stroke: #c98a2b; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
      .loop { stroke: #6b9e83; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
      .elab { fill: #3c6b53; font-size: 10px; font-weight: 600; }
      .blab { fill: #b06f17; font-size: 10px; font-weight: 700; }
    </style>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#19a567"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b9e83"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="560" rx="14"/>
  <text x="32" y="42" class="title">How one message becomes an answer</text>
  <text x="32" y="62" class="sub">Queue-backed pipeline: the channel server never waits for the LLM</text>

  <!-- Row 1 -->
  <rect class="step-green" x="32" y="96" width="190" height="108" rx="11"/>
  <text x="46" y="122" class="label">1 · Webhook</text>
  <text x="46" y="142" class="desc">/webhook/whatsapp/{tenant}</text>
  <text x="46" y="158" class="desc">verify token per tenant</text>
  <text x="46" y="174" class="desc">text · media · reaction ·</text>
  <text x="46" y="190" class="desc">button / list reply</text>

  <rect class="step" x="254" y="96" width="190" height="108" rx="11"/>
  <text x="268" y="122" class="label">2 · Enqueue</text>
  <text x="268" y="142" class="desc">mark read + typing</text>
  <text x="268" y="158" class="desc">is the sender a human agent?</text>
  <text x="268" y="174" class="desc">push to ARQ (arq:whatsapp)</text>
  <text x="268" y="190" class="desc">HTTP returns immediately</text>

  <rect class="step" x="476" y="96" width="190" height="108" rx="11"/>
  <text x="490" y="122" class="label">3 · Worker</text>
  <text x="490" y="142" class="desc">rate limit: user → warn,</text>
  <text x="490" y="158" class="desc">tenant → Retry(defer=10)</text>
  <text x="490" y="174" class="desc">audio → Whisper transcript</text>
  <text x="490" y="190" class="desc">image → vision description</text>

  <rect class="step-dark" x="698" y="96" width="190" height="108" rx="11"/>
  <text x="712" y="122" class="white">4 · Orchestrator</text>
  <text x="712" y="142" class="whitesub">POST /chat (internal secret)</text>
  <text x="712" y="158" class="whitesub">pick processor by agent_type</text>
  <text x="712" y="174" class="whitesub">build prompt + history + memory</text>
  <text x="712" y="190" class="whitesub">load tenant's enabled tools</text>

  <!-- Row 2 -->
  <rect class="step-dark" x="698" y="248" width="190" height="118" rx="11"/>
  <text x="712" y="274" class="white">5 · Tool loop</text>
  <text x="712" y="294" class="whitesub">LiteLLM Router picks provider</text>
  <text x="712" y="310" class="whitesub">tool call? execute, append</text>
  <text x="712" y="326" class="whitesub">result (truncated to 4000)</text>
  <text x="712" y="342" class="whitesub">max 5 iterations / 120s</text>
  <text x="712" y="358" class="whitesub">no tool call → that's the answer</text>

  <rect class="step" x="476" y="248" width="190" height="118" rx="11"/>
  <text x="490" y="274" class="label">6 · Tools</text>
  <text x="490" y="294" class="desc">built-in: end_conversation,</text>
  <text x="490" y="310" class="desc">escalate_to_human</text>
  <text x="490" y="326" class="desc">MCP: knowledge base (RAG),</text>
  <text x="490" y="342" class="desc">catalog, hours, orders,</text>
  <text x="490" y="358" class="desc">locations, meetings…</text>

  <rect class="step" x="254" y="248" width="190" height="118" rx="11"/>
  <text x="268" y="274" class="label">7 · Post-process</text>
  <text x="268" y="294" class="desc">processor rewrites/validates</text>
  <text x="268" y="310" class="desc">save message + latency + model</text>
  <text x="268" y="326" class="desc">background jobs: profile,</text>
  <text x="268" y="342" class="desc">memory, insights, lead score</text>
  <text x="268" y="358" class="desc">choose response type</text>

  <rect class="step-green" x="32" y="248" width="190" height="118" rx="11"/>
  <text x="46" y="274" class="label">8 · Reply</text>
  <text x="46" y="294" class="desc">worker sends via WhatsApp:</text>
  <text x="46" y="310" class="desc">text · buttons · list ·</text>
  <text x="46" y="326" class="desc">media · template · flow</text>
  <text x="46" y="342" class="desc">empty + not silent =</text>
  <text x="46" y="358" class="desc">logged contract violation</text>

  <!-- Escalation branch -->
  <rect x="254" y="414" width="634" height="94" rx="11" stroke="#e3c79a" fill="#fdf6ea" stroke-width="1.5"/>
  <text x="270" y="440" class="label" fill="#8a5a12">Escalation branch — the LLM calls escalate_to_human</text>
  <text x="270" y="460" class="desc" fill="#8a5a12">picks the least-loaded active agent, ordered by total_conversations · notifies by WhatsApp, dashboard or email</text>
  <text x="270" y="476" class="desc" fill="#8a5a12">conversation flips to a silent proxy: the agent's phone and the customer's phone are bridged in both directions</text>
  <text x="270" y="492" class="desc" fill="#8a5a12">the agent drives it with slash commands — /end, /status, /transfer, /online, /offline, /help — never leaving WhatsApp</text>

  <!-- Edges -->
  <path class="edge" d="M222,150 L254,150" marker-end="url(#m)"/>
  <path class="edge" d="M444,150 L476,150" marker-end="url(#m)"/>
  <path class="edge" d="M666,150 L698,150" marker-end="url(#m)"/>
  <path class="edge" d="M793,204 L793,248" marker-end="url(#m)"/>
  <path class="loop" d="M698,300 L666,300" marker-end="url(#g)"/>
  <path class="loop" d="M666,330 L698,330" marker-end="url(#g)"/>
  <text x="560" y="238" class="elab">call ⇄ result, up to 5 times</text>
  <path class="edge" d="M476,340 L444,340" marker-end="url(#m)"/>
  <text x="452" y="238" class="elab">final answer</text>
  <path class="edge" d="M254,300 L222,300" marker-end="url(#m)"/>
  <path class="branch" d="M571,366 L571,414" marker-end="url(#b)"/>
  <text x="578" y="396" class="blab">escalate</text>
</svg>
