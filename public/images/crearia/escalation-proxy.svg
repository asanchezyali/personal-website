<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #f8f6fd; }
      .card { fill: #ffffff; stroke: #e3ddf6; stroke-width: 1.5; }
      .card-accent { fill: #eee9fd; stroke: #cec1fa; stroke-width: 1.5; }
      .card-dark { fill: #1c0a45; stroke: #33196e; stroke-width: 1.5; }
      .title { fill: #1c0a45; font-size: 18px; font-weight: 700; }
      .sub { fill: #6b6480; font-size: 11px; }
      .label { fill: #33206b; font-size: 12.5px; font-weight: 700; }
      .desc { fill: #6b6480; font-size: 10.5px; }
      .white { fill: #ffffff; font-size: 12.5px; font-weight: 700; }
      .whitesub { fill: #c4b5fd; font-size: 10.5px; }
      .edge { stroke: #591ee5; stroke-width: 2; fill: none; }
      .edge-soft { stroke: #8b78c9; stroke-width: 1.6; fill: none; }
      .elab { fill: #5c4a94; font-size: 10px; font-weight: 600; }
      .cmd { fill: #2a1268; font-size: 11.5px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
      .cmdd { fill: #6b6480; font-size: 10.5px; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#591ee5"/>
    </marker>
    <marker id="as" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b78c9"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="470" rx="14"/>
  <text x="32" y="42" class="title">The human handoff, without leaving WhatsApp</text>
  <text x="32" y="62" class="sub">A silent proxy bridges two phone numbers; the agent never opens a dashboard</text>

  <!-- Customer -->
  <rect class="card-accent" x="32" y="120" width="170" height="92" rx="12"/>
  <text x="117" y="152" text-anchor="middle" class="label">Customer</text>
  <text x="117" y="172" text-anchor="middle" class="desc">their own WhatsApp</text>
  <text x="117" y="190" text-anchor="middle" class="desc">never told a human</text>
  <text x="117" y="204" text-anchor="middle" class="desc">took over</text>

  <!-- Orchestrator / proxy -->
  <rect class="card-dark" x="330" y="104" width="260" height="124" rx="13"/>
  <text x="460" y="134" text-anchor="middle" class="white">Message proxy</text>
  <text x="460" y="158" text-anchor="middle" class="whitesub">conversation → escalated</text>
  <text x="460" y="176" text-anchor="middle" class="whitesub">relays both directions</text>
  <text x="460" y="194" text-anchor="middle" class="whitesub">every message stored with</text>
  <text x="460" y="212" text-anchor="middle" class="whitesub">proxy_metadata</text>

  <!-- Human agent -->
  <rect class="card-accent" x="718" y="120" width="170" height="92" rx="12"/>
  <text x="803" y="152" text-anchor="middle" class="label">Human agent</text>
  <text x="803" y="172" text-anchor="middle" class="desc">their own WhatsApp</text>
  <text x="803" y="190" text-anchor="middle" class="desc">least-loaded pick, by</text>
  <text x="803" y="204" text-anchor="middle" class="desc">total_conversations</text>

  <!-- Selection note -->
  <rect class="card" x="330" y="252" width="260" height="70" rx="11"/>
  <text x="460" y="276" text-anchor="middle" class="label">Notified by</text>
  <text x="460" y="296" text-anchor="middle" class="desc">WhatsApp · dashboard · email</text>
  <text x="460" y="312" text-anchor="middle" class="desc">whichever the agent has set</text>

  <!-- Commands -->
  <rect class="card" x="32" y="348" width="856" height="98" rx="12"/>
  <text x="52" y="374" class="label">The agent drives the whole conversation with slash commands</text>

  <text x="52" y="402" class="cmd">/status</text>
  <text x="52" y="420" class="cmdd">what am I handling,</text>
  <text x="52" y="434" class="cmdd">and for how long</text>

  <text x="226" y="402" class="cmd">/transfer</text>
  <text x="226" y="420" class="cmdd">hand off, with an</text>
  <text x="226" y="434" class="cmdd">LLM-written summary</text>

  <text x="400" y="402" class="cmd">/end</text>
  <text x="400" y="420" class="cmdd">give the conversation</text>
  <text x="400" y="434" class="cmdd">back to the AI</text>

  <text x="574" y="402" class="cmd">/online · /offline</text>
  <text x="574" y="420" class="cmdd">availability, which feeds</text>
  <text x="574" y="434" class="cmdd">the next assignment</text>

  <text x="762" y="402" class="cmd">/help</text>
  <text x="762" y="420" class="cmdd">the whole interface,</text>
  <text x="762" y="434" class="cmdd">in one message</text>

  <!-- Edges -->
  <path class="edge" d="M202,152 L330,142" marker-end="url(#a)"/>
  <text x="222" y="134" class="elab">customer message</text>
  <path class="edge" d="M590,142 L718,152" marker-end="url(#a)"/>
  <text x="612" y="134" class="elab">relayed</text>
  <path class="edge-soft" d="M718,190 L590,200" marker-end="url(#as)"/>
  <text x="612" y="220" class="elab">agent reply</text>
  <path class="edge-soft" d="M330,200 L202,190" marker-end="url(#as)"/>
  <text x="206" y="220" class="elab">delivered as the agent</text>
  <path class="edge-soft" d="M460,228 L460,252" marker-end="url(#as)"/>
</svg>
