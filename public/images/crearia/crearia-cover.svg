<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c3226"/>
      <stop offset="55%" stop-color="#0f3d2e"/>
      <stop offset="100%" stop-color="#134a38"/>
    </linearGradient>
    <style>
      .eyebrow { fill: #57c98d; font-size: 19px; font-weight: 700; letter-spacing: .18em; }
      .h1 { fill: #ffffff; font-size: 62px; font-weight: 800; letter-spacing: -.015em; }
      .lede { fill: #a9d9be; font-size: 25px; font-weight: 400; }
      .chip-t { fill: #cfeedd; font-size: 17px; font-weight: 600; }
      .chip { fill: #16543f; stroke: #2b7d5d; stroke-width: 1.5; }
      .node { fill: none; stroke: #2f8a66; stroke-width: 2; }
      .dot { fill: #57c98d; }
      .dotf { fill: #19a567; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bgg)"/>

  <!-- decorative node graph, right side -->
  <g opacity="0.55">
    <path class="node" d="M905,150 L1035,215"/>
    <path class="node" d="M905,150 L905,300"/>
    <path class="node" d="M905,300 L1035,215"/>
    <path class="node" d="M905,300 L1010,395"/>
    <path class="node" d="M1035,215 L1010,395"/>
    <path class="node" d="M905,300 L800,370"/>
    <path class="node" d="M1010,395 L935,480"/>
    <path class="node" d="M800,370 L935,480"/>
    <circle class="dot" cx="905" cy="150" r="9"/>
    <circle class="dotf" cx="1035" cy="215" r="13"/>
    <circle class="dotf" cx="905" cy="300" r="16"/>
    <circle class="dot" cx="1010" cy="395" r="10"/>
    <circle class="dot" cx="800" cy="370" r="8"/>
    <circle class="dot" cx="935" cy="480" r="11"/>
  </g>

  <text x="88" y="152" class="eyebrow">ENGINEERING CASE STUDY · 02</text>

  <text x="88" y="248" class="h1">CREARIA Agent</text>

  <text x="88" y="316" class="lede">RAG, MCP tool orchestration, and a queue</text>
  <text x="88" y="352" class="lede">that changed the design.</text>

  <!-- chips -->
  <rect class="chip" x="88" y="416" width="132" height="44" rx="22"/>
  <text x="154" y="444" text-anchor="middle" class="chip-t">FastAPI</text>

  <rect class="chip" x="234" y="416" width="128" height="44" rx="22"/>
  <text x="298" y="444" text-anchor="middle" class="chip-t">pgvector</text>

  <rect class="chip" x="376" y="416" width="96" height="44" rx="22"/>
  <text x="424" y="444" text-anchor="middle" class="chip-t">MCP</text>

  <rect class="chip" x="486" y="416" width="112" height="44" rx="22"/>
  <text x="542" y="444" text-anchor="middle" class="chip-t">LiteLLM</text>

  <rect class="chip" x="612" y="416" width="140" height="44" rx="22"/>
  <text x="682" y="444" text-anchor="middle" class="chip-t">ARQ + Redis</text>

  <text x="88" y="536" class="lede" font-size="20" fill="#7fbd9d">asanchezyali.com</text>
</svg>
