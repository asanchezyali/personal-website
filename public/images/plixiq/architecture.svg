<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #f6faf7; }
      .card { fill: #ffffff; stroke: #d9e6dd; stroke-width: 1.5; }
      .card-green { fill: #e9f6ee; stroke: #bfe3cc; stroke-width: 1.5; }
      .card-dark { fill: #0f3d2e; stroke: #15543f; stroke-width: 1.5; }
      .title { fill: #0f3d2e; font-size: 15px; font-weight: 700; }
      .label { fill: #1f4a39; font-size: 12px; font-weight: 600; }
      .sub { fill: #5a6b62; font-size: 11px; }
      .white { fill: #ffffff; font-size: 13px; font-weight: 700; }
      .whitesub { fill: #b9e6cc; font-size: 10.5px; }
      .group { fill: #0f3d2e; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
      .edge { stroke: #6b9e83; stroke-width: 1.6; fill: none; }
      .edge-strong { stroke: #19a567; stroke-width: 2.2; fill: none; }
      .elab { fill: #3c6b53; font-size: 10px; font-weight: 600; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b9e83"/>
    </marker>
    <marker id="arrs" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#19a567"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="600" rx="14"/>
  <text x="32" y="40" class="title" font-size="18">Plixiq — high-level architecture</text>
  <text x="32" y="60" class="sub">Multi-tenant AI agents on WhatsApp, with escalation to human agents</text>

  <!-- Customer -->
  <rect class="card-green" x="32" y="92" width="150" height="74" rx="12"/>
  <text x="107" y="124" text-anchor="middle" class="label">Customer</text>
  <text x="107" y="143" text-anchor="middle" class="sub">WhatsApp chat</text>

  <!-- Meta WhatsApp Cloud API -->
  <rect class="card" x="32" y="206" width="150" height="84" rx="12"/>
  <text x="107" y="236" text-anchor="middle" class="label">WhatsApp</text>
  <text x="107" y="253" text-anchor="middle" class="label">Cloud API</text>
  <text x="107" y="272" text-anchor="middle" class="sub">Meta · webhooks</text>

  <!-- Backend big box -->
  <rect class="card" x="244" y="84" width="372" height="330" rx="14"/>
  <text x="264" y="110" class="group">BACKEND · FastAPI (MODULAR MONOLITH · 12 COMPONENTS)</text>

  <!-- Webhook / API -->
  <rect class="card-green" x="264" y="124" width="150" height="58" rx="10"/>
  <text x="339" y="148" text-anchor="middle" class="label">Webhook + REST</text>
  <text x="339" y="166" text-anchor="middle" class="sub">HMAC · rate limit · CSRF</text>

  <!-- LLM gateway -->
  <rect class="card-green" x="436" y="124" width="160" height="58" rx="10"/>
  <text x="516" y="148" text-anchor="middle" class="label">LiteLLM gateway</text>
  <text x="516" y="166" text-anchor="middle" class="sub">per-agent credentials</text>

  <!-- Message pipeline -->
  <rect class="card-dark" x="264" y="198" width="332" height="100" rx="10"/>
  <text x="280" y="222" class="white">Message pipeline</text>
  <text x="280" y="242" class="whitesub">input guard → strategy → LLM + tools</text>
  <text x="280" y="258" class="whitesub">→ output guard → reply → WebSocket event</text>
  <text x="280" y="276" class="whitesub">messaging · conversation · escalation · calendar</text>
  <text x="280" y="291" class="whitesub">billing · audit · contract · identity …</text>

  <!-- Agent strategies -->
  <rect class="card" x="264" y="312" width="150" height="84" rx="10"/>
  <text x="339" y="338" text-anchor="middle" class="label">Agent strategies</text>
  <text x="339" y="356" text-anchor="middle" class="sub">customer_support</text>
  <text x="339" y="372" text-anchor="middle" class="sub">sales · flow (graph)</text>
  <text x="339" y="388" text-anchor="middle" class="sub">pluggable registry</text>

  <!-- Event hub -->
  <rect class="card" x="436" y="312" width="160" height="84" rx="10"/>
  <text x="516" y="338" text-anchor="middle" class="label">EventHub · WebSocket</text>
  <text x="516" y="356" text-anchor="middle" class="sub">in-process fan-out</text>
  <text x="516" y="372" text-anchor="middle" class="sub">/ws + Redis ticket</text>
  <text x="516" y="388" text-anchor="middle" class="sub">single instance today</text>

  <!-- LLM providers -->
  <rect class="card-green" x="680" y="100" width="208" height="68" rx="12"/>
  <text x="784" y="126" text-anchor="middle" class="label">LLM providers</text>
  <text x="784" y="144" text-anchor="middle" class="sub">Groq · OpenAI · Anthropic</text>
  <text x="784" y="160" text-anchor="middle" class="sub">any LiteLLM provider</text>

  <!-- Postgres -->
  <rect class="card" x="680" y="182" width="208" height="68" rx="12"/>
  <text x="784" y="208" text-anchor="middle" class="label">PostgreSQL · Neon</text>
  <text x="784" y="226" text-anchor="middle" class="sub">16 tables · orgs, agents,</text>
  <text x="784" y="242" text-anchor="middle" class="sub">conversations, appointments</text>

  <!-- Redis -->
  <rect class="card" x="680" y="264" width="208" height="76" rx="12"/>
  <text x="784" y="290" text-anchor="middle" class="label">Redis · Upstash</text>
  <text x="784" y="308" text-anchor="middle" class="sub">config cache L1+L2 · WS tickets</text>
  <text x="784" y="324" text-anchor="middle" class="sub">timeout timers (sorted set)</text>

  <!-- Polar -->
  <rect class="card-green" x="680" y="354" width="208" height="62" rx="12"/>
  <text x="784" y="380" text-anchor="middle" class="label">Polar.sh</text>
  <text x="784" y="398" text-anchor="middle" class="sub">seats + metered conversations</text>

  <!-- Frontend + Human agents -->
  <rect class="card-dark" x="244" y="440" width="372" height="118" rx="14"/>
  <text x="264" y="466" class="white">Dashboard — Next.js + Effect</text>
  <text x="264" y="487" class="whitesub">Human agents monitor &amp; reply in real time</text>
  <text x="264" y="505" class="whitesub">Live updates over WebSocket · same-origin /api proxy</text>
  <text x="264" y="529" class="whitesub">conversations · agents · flows · billing · audit</text>

  <rect class="card-green" x="680" y="440" width="208" height="118" rx="14"/>
  <text x="784" y="470" text-anchor="middle" class="label">Human agent</text>
  <text x="784" y="489" text-anchor="middle" class="sub">Takes over on escalation</text>
  <text x="784" y="507" text-anchor="middle" class="sub">Least-loaded assignment</text>
  <text x="784" y="532" text-anchor="middle" class="sub">Optional WhatsApp proxy</text>

  <!-- Edges -->
  <path class="edge" d="M107,166 L107,206" marker-end="url(#arr)"/>
  <text x="114" y="190" class="elab">message</text>
  <path class="edge-strong" d="M182,248 L244,212" marker-end="url(#arrs)"/>
  <text x="186" y="234" class="elab">webhook</text>
  <path class="edge" d="M339,182 L339,198" marker-end="url(#arr)"/>
  <path class="edge" d="M516,182 L516,198" marker-end="url(#arr)"/>
  <path class="edge-strong" d="M596,150 L680,138" marker-end="url(#arrs)"/>
  <path class="edge" d="M596,244 L680,220" marker-end="url(#arr)"/>
  <text x="608" y="234" class="elab">read/write</text>
  <path class="edge" d="M596,340 L680,306" marker-end="url(#arr)"/>
  <path class="edge" d="M339,298 L339,312" marker-end="url(#arr)"/>
  <path class="edge" d="M596,405 L680,405" marker-end="url(#arr)"/>
  <text x="620" y="398" class="elab">usage</text>
  <path class="edge-strong" d="M516,396 L516,440" marker-end="url(#arrs)"/>
  <text x="524" y="422" class="elab">WebSocket</text>
  <path class="edge" d="M616,499 L680,499" marker-end="url(#arr)"/>
</svg>
