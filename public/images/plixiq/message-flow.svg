<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #f6faf7; }
      .step { fill: #ffffff; stroke: #d9e6dd; stroke-width: 1.5; }
      .step-green { fill: #e9f6ee; stroke: #bfe3cc; stroke-width: 1.5; }
      .step-dark { fill: #0f3d2e; stroke: #15543f; stroke-width: 1.5; }
      .title { fill: #0f3d2e; font-size: 18px; font-weight: 700; }
      .sub { fill: #5a6b62; font-size: 11px; }
      .label { fill: #1f4a39; font-size: 12.5px; font-weight: 700; }
      .desc { fill: #5a6b62; font-size: 10.5px; }
      .white { fill: #ffffff; font-size: 12.5px; font-weight: 700; }
      .whitesub { fill: #b9e6cc; font-size: 10.5px; }
      .edge { stroke: #19a567; stroke-width: 2; fill: none; }
      .branch { stroke: #c98a2b; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
      .meter { stroke: #6b9e83; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
      .elab { fill: #3c6b53; font-size: 10px; font-weight: 600; }
      .blab { fill: #b06f17; font-size: 10px; font-weight: 700; }
    </style>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#19a567"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b9e83"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="530" rx="14"/>
  <text x="32" y="42" class="title">How one WhatsApp message is handled</text>
  <text x="32" y="62" class="sub">Inbound message → AI reply, with the escalation and metering branches</text>

  <!-- Row 1 -->
  <rect class="step-green" x="32" y="96" width="190" height="104" rx="11"/>
  <text x="46" y="122" class="label">1 · Webhook in</text>
  <text x="46" y="142" class="desc">POST /webhook/whatsapp</text>
  <text x="46" y="158" class="desc">HMAC-SHA256 verified</text>
  <text x="46" y="174" class="desc">rate limited</text>
  <text x="46" y="190" class="desc">tenant by phone_number_id</text>

  <rect class="step" x="254" y="96" width="190" height="104" rx="11"/>
  <text x="268" y="122" class="label">2 · Route + short-circuit</text>
  <text x="268" y="142" class="desc">sender is a human agent?</text>
  <text x="268" y="158" class="desc">→ WhatsApp proxy</text>
  <text x="268" y="174" class="desc">WITH_HUMAN · queued ·</text>
  <text x="268" y="190" class="desc">role reply · token cap</text>

  <rect class="step" x="476" y="96" width="190" height="104" rx="11"/>
  <text x="490" y="122" class="label">3 · Input guard</text>
  <text x="490" y="142" class="desc">LLM safety classifier</text>
  <text x="490" y="158" class="desc">SAFE / UNSAFE_INJECTION</text>
  <text x="490" y="174" class="desc">/ UNSAFE_DANGEROUS</text>
  <text x="490" y="190" class="desc">fails closed</text>

  <rect class="step" x="698" y="96" width="190" height="104" rx="11"/>
  <text x="712" y="122" class="label">4 · Dispatch by type</text>
  <text x="712" y="142" class="desc">flow → graph engine</text>
  <text x="712" y="158" class="desc">else: system prompt +</text>
  <text x="712" y="174" class="desc">history + calendar context</text>
  <text x="712" y="190" class="desc">+ tool definitions</text>

  <!-- Row 2 -->
  <rect class="step-dark" x="698" y="244" width="190" height="104" rx="11"/>
  <text x="712" y="270" class="white">5 · LLM call</text>
  <text x="712" y="290" class="whitesub">LiteLLM gateway</text>
  <text x="712" y="306" class="whitesub">per-agent primary key</text>
  <text x="712" y="322" class="whitesub">→ fallback on failure</text>
  <text x="712" y="338" class="whitesub">usage counted per call</text>

  <rect class="step" x="476" y="244" width="190" height="104" rx="11"/>
  <text x="490" y="270" class="label">6 · Tool handling</text>
  <text x="490" y="290" class="desc">escalate_to_human</text>
  <text x="490" y="306" class="desc">calendar: check / book /</text>
  <text x="490" y="322" class="desc">cancel / reschedule</text>
  <text x="490" y="338" class="desc">flow: advance · navigate</text>

  <rect class="step" x="254" y="244" width="190" height="104" rx="11"/>
  <text x="268" y="270" class="label">7 · Output guard</text>
  <text x="268" y="290" class="desc">role-exit phrases</text>
  <text x="268" y="306" class="desc">8-gram prompt leak</text>
  <text x="268" y="322" class="desc">language · length</text>
  <text x="268" y="338" class="desc">retry at temp 0, then fall back</text>

  <rect class="step-dark" x="32" y="244" width="190" height="104" rx="11"/>
  <text x="46" y="270" class="white">8 · Send + persist</text>
  <text x="46" y="290" class="whitesub">WhatsApp Cloud API</text>
  <text x="46" y="306" class="whitesub">tokens stored per message</text>
  <text x="46" y="322" class="whitesub">WebSocket event to dashboard</text>
  <text x="46" y="338" class="whitesub">follow-up / close timers</text>

  <!-- Metering branch -->
  <rect class="step-green" x="32" y="392" width="190" height="86" rx="11"/>
  <text x="46" y="418" class="label">On close</text>
  <text x="46" y="438" class="desc">conversation.completed</text>
  <text x="46" y="454" class="desc">→ Polar, beyond the</text>
  <text x="46" y="470" class="desc">included allowance</text>

  <!-- Escalation branch -->
  <rect x="254" y="392" width="634" height="86" rx="11" stroke="#e3c79a" fill="#fdf6ea" stroke-width="1.5"/>
  <text x="270" y="418" class="label" fill="#8a5a12">Escalation branch — triggered at step 2, 6 or 7</text>
  <text x="270" y="438" class="desc" fill="#8a5a12">picks the least-loaded agent that is online, available and under max_concurrent · falls back to the "general" role</text>
  <text x="270" y="454" class="desc" fill="#8a5a12">when several roles match, the LLM writes the menu and classifies the reply (role / decline / unclear, 2 retries)</text>
  <text x="270" y="470" class="desc" fill="#8a5a12">all busy → queued with position · nobody online → contextual apology · then optional WhatsApp proxy agent ↔ customer</text>

  <!-- Edges row 1 -->
  <path class="edge" d="M222,148 L254,148" marker-end="url(#m)"/>
  <path class="edge" d="M444,148 L476,148" marker-end="url(#m)"/>
  <path class="edge" d="M666,148 L698,148" marker-end="url(#m)"/>
  <path class="edge" d="M793,200 L793,244" marker-end="url(#m)"/>
  <!-- Edges row 2 (right to left) -->
  <path class="edge" d="M698,296 L666,296" marker-end="url(#m)"/>
  <path class="edge" d="M476,296 L444,296" marker-end="url(#m)"/>
  <text x="452" y="238" class="elab">no handoff</text>
  <path class="edge" d="M254,296 L222,296" marker-end="url(#m)"/>
  <!-- Branches -->
  <path class="branch" d="M571,348 L571,392" marker-end="url(#b)"/>
  <text x="578" y="374" class="blab">handoff</text>
  <path class="meter" d="M127,348 L127,392" marker-end="url(#g)"/>
  <text x="134" y="374" class="elab">closed</text>
</svg>
