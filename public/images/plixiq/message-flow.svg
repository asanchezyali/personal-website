<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #f6faf7; }
      .step { fill: #ffffff; stroke: #d9e6dd; stroke-width: 1.5; }
      .step-green { fill: #e9f6ee; stroke: #bfe3cc; stroke-width: 1.5; }
      .step-dark { fill: #0f3d2e; stroke: #15543f; stroke-width: 1.5; }
      .title { fill: #0f3d2e; font-size: 18px; font-weight: 700; }
      .sub { fill: #5a6b62; font-size: 11px; }
      .label { fill: #1f4a39; font-size: 12.5px; font-weight: 700; }
      .desc { fill: #5a6b62; font-size: 10.5px; }
      .white { fill: #ffffff; font-size: 12.5px; font-weight: 700; }
      .whitesub { fill: #b9e6cc; font-size: 10.5px; }
      .edge { stroke: #19a567; stroke-width: 2; fill: none; }
      .branch { stroke: #c98a2b; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
      .elab { fill: #3c6b53; font-size: 10px; font-weight: 600; }
      .blab { fill: #b06f17; font-size: 10px; font-weight: 700; }
    </style>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#19a567"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="470" rx="14"/>
  <text x="32" y="42" class="title">How one WhatsApp message is handled</text>
  <text x="32" y="62" class="sub">Inbound message → AI reply, with a human-handoff branch</text>

  <!-- Row 1: 4 steps -->
  <!-- 1 webhook -->
  <rect class="step-green" x="32" y="92" width="190" height="88" rx="11"/>
  <text x="46" y="118" class="label">1 · Webhook in</text>
  <text x="46" y="138" class="desc">POST /webhook/whatsapp</text>
  <text x="46" y="154" class="desc">HMAC-SHA256 signature</text>
  <text x="46" y="170" class="desc">rate limit · pick tenant</text>

  <!-- 2 input guard -->
  <rect class="step" x="254" y="92" width="190" height="88" rx="11"/>
  <text x="268" y="118" class="label">2 · Input guard</text>
  <text x="268" y="138" class="desc">AI safety classifier</text>
  <text x="268" y="154" class="desc">blocks abuse / spam</text>
  <text x="268" y="170" class="desc">get-or-create conversation</text>

  <!-- 3 build prompt -->
  <rect class="step" x="476" y="92" width="190" height="88" rx="11"/>
  <text x="490" y="118" class="label">3 · Build prompt</text>
  <text x="490" y="138" class="desc">agent config from</text>
  <text x="490" y="154" class="desc">Redis cache (TTL 300s)</text>
  <text x="490" y="170" class="desc">+ history + brand</text>

  <!-- 4 LLM -->
  <rect class="step-dark" x="698" y="92" width="190" height="88" rx="11"/>
  <text x="712" y="118" class="white">4 · LLM call</text>
  <text x="712" y="138" class="whitesub">LiteLLM gateway</text>
  <text x="712" y="154" class="whitesub">Groq (free, fast)</text>
  <text x="712" y="170" class="whitesub">→ OpenAI on failure</text>

  <!-- Row 2: escalation decision -->
  <!-- 5 escalation -->
  <rect class="step-green" x="698" y="232" width="190" height="92" rx="11"/>
  <text x="712" y="258" class="label">5 · Escalation check</text>
  <text x="712" y="278" class="desc">keywords + sentiment</text>
  <text x="712" y="294" class="desc">agent available?</text>
  <text x="712" y="310" class="desc">within concurrency limit?</text>

  <!-- 6 output guard -->
  <rect class="step" x="476" y="232" width="190" height="92" rx="11"/>
  <text x="490" y="258" class="label">6 · Output guard</text>
  <text x="490" y="278" class="desc">language + format check</text>
  <text x="490" y="294" class="desc">length / safety</text>
  <text x="490" y="310" class="desc">persist message + tokens</text>

  <!-- 7 send reply -->
  <rect class="step-dark" x="254" y="232" width="190" height="92" rx="11"/>
  <text x="268" y="258" class="white">7 · Send reply</text>
  <text x="268" y="278" class="whitesub">WhatsApp Cloud API</text>
  <text x="268" y="294" class="whitesub">publish SSE event</text>
  <text x="268" y="310" class="whitesub">schedule follow-up / close</text>

  <!-- 8 customer -->
  <rect class="step-green" x="32" y="232" width="190" height="92" rx="11"/>
  <text x="46" y="258" class="label">8 · Customer</text>
  <text x="46" y="278" class="desc">receives the answer</text>
  <text x="46" y="294" class="desc">on WhatsApp</text>
  <text x="46" y="310" class="desc">loop continues</text>

  <!-- Branch: human handoff -->
  <rect class="step" x="476" y="372" width="412" height="70" rx="11" stroke="#e3c79a" fill="#fdf6ea"/>
  <text x="492" y="398" class="label" fill="#8a5a12">Human handoff branch</text>
  <text x="492" y="418" class="desc" fill="#8a5a12">status → WITH_HUMAN · round-robin assign · notify agent over SSE</text>
  <text x="492" y="433" class="desc" fill="#8a5a12">optional WhatsApp proxy bridges agent ↔ customer until they close it</text>

  <!-- Edges row 1 -->
  <path class="edge" d="M222,136 L254,136" marker-end="url(#m)"/>
  <path class="edge" d="M444,136 L476,136" marker-end="url(#m)"/>
  <path class="edge" d="M666,136 L698,136" marker-end="url(#m)"/>
  <!-- down to row 2 -->
  <path class="edge" d="M793,180 L793,232" marker-end="url(#m)"/>
  <!-- escalation -> output guard (no escalation path) -->
  <path class="edge" d="M698,278 L666,278" marker-end="url(#m)"/>
  <text x="612" y="226" class="elab">no handoff</text>
  <path class="edge" d="M476,278 L444,278" marker-end="url(#m)"/>
  <path class="edge" d="M254,278 L222,278" marker-end="url(#m)"/>
  <!-- branch down -->
  <path class="branch" d="M793,324 L793,372" marker-end="url(#b)"/>
  <text x="800" y="352" class="blab">handoff</text>
</svg>
